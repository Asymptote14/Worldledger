[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "worldledger"
version = "0.1.0"
description = "A stateful text-world research prototype driven by language models"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "WorldLedger contributors" }
]
dependencies = []

[project.scripts]
worldledger = "worldledger.main:main"

[tool.setuptools.packages.find]
include = ["worldledger*"]
